# Render Blueprint configuration for Regency Assets Management Voting Portal
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: regency-voting-portal
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
